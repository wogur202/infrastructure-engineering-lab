apiVersion: batch/v1
kind: Job
metadata:
  name: step08-k6
  namespace: aegis-step08
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: step08-k6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        aegis.lab/role: support
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: k6
        image: grafana/k6:1.0.0@sha256:f21270290d702cbf0a7d6ba5d7ed100b63bcb233b558b885ed787547b3488279
        command:
        - /bin/sh
        - -c
        args:
        - k6 run --out json=/results/raw.json /scripts/cpu.js; rc=$?; echo "K6_EXIT_CODE=$rc";
          sleep 300; exit "$rc"
        env:
        - name: RATE
          value: PILOT_REQUIRED
        - name: WORK_ITERATIONS
          value: PILOT_REQUIRED
        - name: BASE_URL
          value: http://api.aegis-step08.svc.cluster.local:8080
        - name: K6_NO_USAGE_REPORT
          value: 'true'
        - name: DURATION
          value: 240s
        - name: WARMUP_SECONDS
          value: '60'
        - name: PRE_VUS
          value: '16'
        - name: MAX_VUS
          value: '64'
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 400m
            memory: 512Mi
            ephemeral-storage: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: results
          mountPath: /results
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: script
        configMap:
          name: step08-load
      - name: results
        emptyDir:
          sizeLimit: 512Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
