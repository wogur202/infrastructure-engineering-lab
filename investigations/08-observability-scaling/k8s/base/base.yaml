apiVersion: v1
kind: Namespace
metadata:
  name: aegis-step08
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-step08-api
  namespace: aegis-step08
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: aegis-step08-api
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        aegis.lab/role: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
      - name: api
        image: invalid.local/step08/not-built:blocked
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: step08-local-unpublished
        - name: WORK_ITERATIONS
          value: '50000'
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aegis-step08
spec:
  type: ClusterIP
  selector:
    app: aegis-step08-api
  ports:
  - name: http
    port: 8080
    targetPort: http
