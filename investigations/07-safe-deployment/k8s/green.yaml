{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "aegis-api-green",
        "namespace": "aegis"
      },
      "spec": {
        "replicas": 2,
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxSurge": 1,
            "maxUnavailable": 0
          }
        },
        "selector": {
          "matchLabels": {
            "app": "aegis-api-step07",
            "slot": "green"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "aegis-api-step07",
              "slot": "green"
            }
          },
          "spec": {
            "topologySpreadConstraints": [
              {
                "maxSkew": 1,
                "topologyKey": "kubernetes.io/hostname",
                "whenUnsatisfiable": "DoNotSchedule",
                "labelSelector": {
                  "matchLabels": {
                    "app": "aegis-api-step07",
                    "slot": "green"
                  }
                }
              }
            ],
            "containers": [
              {
                "name": "api",
                "image": "${GREEN_IMAGE}",
                "imagePullPolicy": "IfNotPresent",
                "env": [
                  {
                    "name": "APP_VERSION",
                    "value": "${GREEN_VERSION}"
                  },
                  {
                    "name": "APP_SLOT",
                    "value": "green"
                  },
                  {
                    "name": "INJECT_API_FAILURE",
                    "value": "${GREEN_FAILURE}"
                  }
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8080
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": "http"
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": "http"
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 10
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "250m",
                    "memory": "128Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "aegis-api-green",
        "namespace": "aegis"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app": "aegis-api-step07",
          "slot": "green"
        },
        "ports": [
          {
            "name": "http",
            "port": 8080,
            "targetPort": "http"
          }
        ]
      }
    }
  ]
}
